stages:
  - test

job_using_vault:
  stage: test
  variables:
    VAULT_AUTH_ROLE: gitlab-infra-repo-ro
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $VAULT_SERVER_URL
  secrets:
    TOKEN:
      vault:
        engine:
          name: kv
          path: gitlab/projects/infra/iac/infrastructure
        path: proxmox_auth
        field: token
      file: false
  script:
    - echo $TOKEN
