ansible_user: svc-ansible-infra
ansible_ssh_pass: "{{ vault_ipa_service_accounts.svc_ansible_infra.password }}"
ansible_become_pass: "{{ vault_ipa_service_accounts.svc_ansible_infra.password }}"
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

vm:
  target_nodes: ["vm"] # List of nodes to deploy the masters to must match master count (max )
  template: fedora44
  count: 1
  primary_count: 1
  cpu: 2
  memory: 2048
  disk_size: 30 # Disk size for root drive of VM in GB
  storage_pool: "local-lvm"
  bridge: "proxmgmt"
  tag: 0
  tags: "infra,ipajoined"
  dns_server: "10.30.0.10"
  search_domain: cbr.infra.ashman.world
  ssh_pub_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF6leLiXjd46rW2/bKTyFtEBXv8A47Ti0kd49CcexgLy asher@fedora
  network_gateway: "{{ network.infra_cbr.gateway }}"
  network_subnet: "{{ network.infra_cbr.subnet }}"
  network_mask: "{{ network.infra_cbr.mask }}"
  network_start_ip: "{{ network.infra_cbr.start_ip.blocky }}"
  description: "Blocky hosts deployed by terraform"
  additional_networks: []

service_name: blocky
site: cbr
dns_zone: "{{ site }}.infra.ashman.world"
hostname: "{{ service_name }}01.{{ dns_zone }}"

vrrp_ip: "{{ network.infra.static_ips.blocky_keepalived }}"

blocky__version: v0.25

blocky__blocking_client_groups_block:
  default:
    - ads

